min_version = "2026.5.12"

[settings]
lockfile = true

[tools]
node = "22"
pnpm = "11.9.0"
python = "3.12"
uv = "latest"
"github:silitics/sidex" = { version = "0.4.1", exe = "sidex" }
"github:cross-rs/cross" = { version = "latest", exe = "cross", os = ["linux/x64"] }
"github:CycloneDX/cyclonedx-rust-cargo" = { version = "latest", exe = "cargo-cyclonedx" }
"github:CycloneDX/cyclonedx-cli" = { version = "latest", exe = "cyclonedx" }

[env]
RUST_BACKTRACE = "1"

[tasks.codegen]
description = "Regenerate the Sidex-generated frontend types."
dir = "frontend"
run = "pnpm run generate:sidex"

[tasks.dev]
description = "Run the frontend development server."
dir = "frontend"
depends = ["frontend:install"]
run = "pnpm run dev"

[tasks.fmt]
description = "Format all Rust code."
run = "cargo fmt"

[tasks.check]
description = "Run the same formatting, lint, frontend, and unit-test checks as CI."
depends = ["check:fmt", "check:clippy", "check:frontend", "test:unit"]

[tasks."check:fmt"]
description = "Verify that every Rust file is formatted by Rustfmt."
run = "cargo fmt --check"

[tasks."check:clippy"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run Clippy with warnings denied."
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."check:frontend"]
description = "Build the frontend and check its TypeScript types."
depends = ["frontend:build"]

[tasks.test]
description = "Run unit tests."
depends = ["test:unit"]

[tasks."test:unit"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run all Rust unit tests."
run = "cargo test --all-features"

[tasks."test:e2e"]
description = "Run browser-driven frontend tests with Nix-provided Chromium."
shell = 'nix develop "{{config_root}}#browser-tests" --command bash -euo pipefail -c'
depends = ["frontend:install"]
dir = "frontend/tests"
run = 'uv run pytest "$@"'

[tasks."test:e2e:headed"]
description = "Run browser tests in a visible browser (requires a display)."
shell = 'nix develop "{{config_root}}#browser-tests" --command bash -euo pipefail -c'
depends = ["frontend:install"]
dir = "frontend/tests"
run = 'uv run pytest --headed --slowmo 250 -s "$@"'

[tasks."test:system"]
shell = "nix develop \"{{config_root}}#system-tests\" --command bash -euo pipefail -c"
description = "Run the QEMU-based system tests against a real Rugix system (requires a container runtime, QEMU, and OVMF)."
dir = "tests"
run = 'uv run pytest "$@"'

[tasks."check:tests"]
description = "Lint, format-check, and type-check the system tests."
dir = "tests"
run = '''
uv run --group dev ruff check .
uv run --group dev ruff format --check .
uv run --group dev mypy .
'''

[tasks."frontend:install"]
description = "Install locked frontend dependencies."
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks."frontend:build"]
description = "Build the frontend assets."
dir = "frontend"
depends = ["frontend:install"]
run = "pnpm run build"

[tasks.build]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Build the frontend and cross-build release binaries for one or more Rust targets."
depends = ["frontend:build"]
run = './scripts/build-binaries.sh "$@"'

[tasks."build:binaries"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Cross-build release binaries using existing frontend assets."
run = './scripts/build-binaries.sh "$@"'
