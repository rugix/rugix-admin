name: Build

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build_frontend:
    name: "Build Frontend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Locked Tools
        run: mise install --locked node pnpm github:silitics/sidex
      - name: Build Frontend
        run: mise run --skip-tools frontend:build
      - name: Upload Frontend Dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build_binaries_linux:
    name: "Build Binary (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs:
      - build_frontend
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-gnueabi
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Install Locked Tools
        run: mise install --locked pnpm python github:cross-rs/cross github:CycloneDX/cyclonedx-rust-cargo github:CycloneDX/cyclonedx-cli
      - name: Download Frontend Dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build Binary
        env:
          RUGIX_ADMIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: mise run --skip-tools build:binaries ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries/binaries-${{ matrix.target }}.tar
          if-no-files-found: error

  system_test:
    name: System Tests
    runs-on: [self-hosted, si-large]
    needs:
      - build_binaries_linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-x86_64-unknown-linux-musl
          path: build/binaries
      - name: Extract Binary
        run: |
          mkdir -p build/binaries/x86_64-unknown-linux-musl
          tar -xf build/binaries/binaries-x86_64-unknown-linux-musl.tar -C build/binaries/x86_64-unknown-linux-musl
      - name: Run System Tests
        shell: bash
        run: |
          set -euo pipefail
          export RUGIX_BAKERY_IMAGE="ghcr.io/rugix/rugix-bakery:branch-main"
          podman pull "$RUGIX_BAKERY_IMAGE"
          mise install --locked python uv
          mise run --skip-tools test:system
      - name: Upload Test Outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-test-outputs
          path: tests/test-outputs/
          if-no-files-found: ignore

  upload_release_assets:
    name: "Upload Release Assets"
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    needs:
      - build_binaries_linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: List Assets
        run: find build/binaries
      - name: Attest Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/binaries/*.tar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} build/binaries/* --clobber
