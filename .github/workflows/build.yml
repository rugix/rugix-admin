name: Build

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build_frontend:
    name: "Build Frontend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Locked Tools
        run: mise install --locked node pnpm github:silitics/sidex
      - name: Build Frontend
        run: mise run --skip-tools frontend:build
      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build_binaries_linux:
    name: "Build Binary (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs:
      - build_frontend
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-gnueabi
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Install Locked Tools
        run: mise install --locked pnpm python github:cross-rs/cross github:CycloneDX/cyclonedx-rust-cargo github:CycloneDX/cyclonedx-cli
      - name: Download Frontend Dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build Binary
        env:
          RUGIX_ADMIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: mise run --skip-tools build:binaries ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries/binaries-${{ matrix.target }}.tar
          if-no-files-found: error

  upload_release_assets:
    name: "Upload Release Assets"
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    needs:
      - build_binaries_linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: List Assets
        run: find build/binaries
      - name: Attest Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: build/binaries/*.tar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} build/binaries/* --clobber
