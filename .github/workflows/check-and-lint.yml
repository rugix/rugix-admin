name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Install Locked Tools
        run: mise install --locked node pnpm github:silitics/sidex
      - name: Check
        run: mise run --skip-tools check
